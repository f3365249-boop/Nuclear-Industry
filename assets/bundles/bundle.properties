item.nuclear-industry-uranium-raw.name = Raw Uranium
item.nuclear-industry-uranium-raw.description = Unenriched uranium ore. Can only be mined with a laser drill or better. Process it in a centrifuge.
item.nuclear-industry-uranium-235.name = Uranium-235
item.nuclear-industry-uranium-235.description = Enriched reactor fuel. Burns for 2 minutes in a uranium reactor.
item.nuclear-industry-uranium-238.name = Uranium-238
item.nuclear-industry-uranium-238.description = Depleted uranium. Byproduct of enrichment.
liquid.nuclear-industry-steam.name = Steam
status.nuclear-industry-radiation.name = Radiation
status.nuclear-industry-radiation.description = Loses 2% of max health every 2 seconds.
block.nuclear-industry-ore-uranium.name = Uranium Ore
block.nuclear-industry-uranium-centrifuge.name = Uranium Centrifuge
block.nuclear-industry-uranium-centrifuge.description = Processes raw uranium in 4 seconds. 10% chance to produce Uranium-235, otherwise Uranium-238. Uses power.
block.nuclear-industry-uranium-reactor.name = Uranium Reactor
block.nuclear-industry-uranium-reactor.description = Burns Uranium-235 and boils water into steam. Needs a constant water supply. If it is destroyed above 1000°C, or has no water above 1000°C for 5 seconds, it explodes and leaves a radiation zone for 10 minutes. More fuel inside means a bigger zone.
block.nuclear-industry-steam-turbine.name = Steam Turbine
block.nuclear-industry-steam-turbine.description = Converts steam into a large amount of power.
bar.nuclear-industry.temp = Temperature: {0}°C
bar.nuclear-industry.fuel = Fuel
nuclear-industry.zone-no-build = Cannot build inside a radiation zone!
block.nuclear-industry-drone-station.name = Drone Station
block.nuclear-industry-drone-station.description = Idle drones circle around it without losing health. Drones below 50% health fly here and the station heals them with blue beams.
block.nuclear-industry-drone-depot.name = Drone Depot
block.nuclear-industry-drone-depot.description = Stores 50 of every item. Worker drones take items from here, 10 at a time.
block.nuclear-industry-drone-receiver.name = Drone Receiver
block.nuclear-industry-drone-receiver.description = Stores 50 of every item. Select an item and worker drones will keep it topped up from drone depots. Use an unloader to take items out.
block.nuclear-industry-drone-factory.name = Drone Factory
block.nuclear-industry-drone-factory.description = Builds the selected drone from items put inside. Needs power. Select a drone to see what it costs.
unit.nuclear-industry-drone-worker.name = Worker Drone
unit.nuclear-industry-drone-worker.description = Carries 10 items at a time from drone depots to drone receivers. 50 health. Loses 5 health per 4 seconds while working.
unit.nuclear-industry-drone-guard.name = Guard Drone
unit.nuclear-industry-drone-guard.description = Escorts worker drones and shoots enemies near them with twin guns. 100 health. Loses 5 health per 4 seconds while working.
unit.nuclear-industry-drone-medic.name = Medic Drone
unit.nuclear-industry-drone-medic.description = Heals workers and guards below 50% health. Helps drones below 6 health first. 100 health. Loses 5 health per 4 seconds while working.
status.nuclear-industry-drone-crippled.name = Crippled
nuclear-industry.select-drone = Select a drone to build
nuclear-industry.build-time = Build time: {0} s
