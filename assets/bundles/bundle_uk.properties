item.nuclear-industry-uranium-raw.name = Незбагачений уран
item.nuclear-industry-uranium-raw.description = Незбагачена уранова руда. Видобувається лише лазерним буром або кращим. Переробляється в центрифузі.
item.nuclear-industry-uranium-235.name = Уран-235
item.nuclear-industry-uranium-235.description = Збагачене паливо. Один предмет горить 2 хвилини в урановому реакторі.
item.nuclear-industry-uranium-238.name = Уран-238
item.nuclear-industry-uranium-238.description = Збіднений уран. Побічний продукт збагачення.
liquid.nuclear-industry-steam.name = Пара
status.nuclear-industry-radiation.name = Радіація
status.nuclear-industry-radiation.description = Втрачає 2% максимального здоров'я кожні 2 секунди.
status.nuclear-industry-drone-crippled.name = Знесилений
block.nuclear-industry-ore-uranium.name = Уранова руда
block.nuclear-industry-uranium-centrifuge.name = Уранова центрифуга
block.nuclear-industry-uranium-centrifuge.description = Переробляє уран за 4 секунди. 10% шанс отримати уран-235, інакше уран-238. Споживає енергію.
block.nuclear-industry-uranium-reactor.name = Урановий реактор
block.nuclear-industry-uranium-reactor.description = Спалює уран-235 і перетворює воду на пару. Потребує постійної подачі води. Якщо його зруйновано при температурі вище 1000°C або він 5 секунд без води вище 1000°C, він вибухає й залишає зону радіації на 10 хвилин. Чим більше палива всередині, тим більша зона.
block.nuclear-industry-steam-turbine.name = Парова турбіна
block.nuclear-industry-steam-turbine.description = Перетворює пару на велику кількість енергії.
block.nuclear-industry-drone-station.name = Станція дронів
block.nuclear-industry-drone-station.description = Навколо неї кружляють дрони без роботи, вони не втрачають здоров'я. Дрони з менш ніж 50% здоров'я прилітають сюди, і станція лікує їх блакитним променем.
block.nuclear-industry-drone-depot.name = Сховище дронів
block.nuclear-industry-drone-depot.description = Зберігає по 50 штук кожного ресурсу. Дрони-робітники беруть звідси ресурси по 10 штук.
block.nuclear-industry-drone-receiver.name = Приймач дронів
block.nuclear-industry-drone-receiver.description = Зберігає по 50 штук кожного ресурсу. Оберіть ресурс, і дрони-робітники поповнюватимуть його зі сховищ дронів. Щоб забрати ресурси, використовуйте розвантажувач.
block.nuclear-industry-drone-factory.name = Фабрика дронів
block.nuclear-industry-drone-factory.description = Створює обраного дрона з ресурсів, покладених усередину. Потребує енергію. Оберіть дрона, щоб побачити його вартість.
unit.nuclear-industry-drone-worker.name = Дрон-робітник
unit.nuclear-industry-drone-worker.description = Переносить по 10 ресурсів зі сховищ дронів до приймачів. 50 здоров'я. Під час роботи втрачає 5 здоров'я за 4 секунди.
unit.nuclear-industry-drone-guard.name = Дрон-захисник
unit.nuclear-industry-drone-guard.description = Супроводжує дронів-робітників і атакує ворогів поруч із ними. 100 здоров'я. У роботі втрачає 5 здоров'я за 4 секунди.
unit.nuclear-industry-drone-medic.name = Дрон-медик
unit.nuclear-industry-drone-medic.description = Лікує робітників і захисників з менш ніж 50% здоров'я. Спершу допомагає дронам з менш ніж 6 здоров'я. 100 здоров'я. У роботі втрачає 5 здоров'я за 4 секунди.
