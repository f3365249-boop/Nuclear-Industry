item.nuclear-industry-uranium-raw.name = Необогащённый уран
item.nuclear-industry-uranium-raw.description = Необогащённая урановая руда. Добывается только лазерным буром или лучше. Перерабатывается в центрифуге.
item.nuclear-industry-uranium-235.name = Уран-235
item.nuclear-industry-uranium-235.description = Обогащённое топливо. Один предмет горит 2 минуты в урановом реакторе.
item.nuclear-industry-uranium-238.name = Уран-238
item.nuclear-industry-uranium-238.description = Обеднённый уран. Побочный продукт обогащения.
liquid.nuclear-industry-steam.name = Пар
status.nuclear-industry-radiation.name = Радиация
status.nuclear-industry-radiation.description = Теряет 2% максимального здоровья каждые 2 секунды.
block.nuclear-industry-ore-uranium.name = Урановая руда
block.nuclear-industry-uranium-centrifuge.name = Урановая центрифуга
block.nuclear-industry-uranium-centrifuge.description = Перерабатывает уран за 4 секунды. 10% шанс получить уран-235, иначе уран-238. Потребляет энергию.
block.nuclear-industry-uranium-reactor.name = Урановый реактор
block.nuclear-industry-uranium-reactor.description = Реактор 4x4. Сжигает уран-235, один предмет за 2 минуты. Чем больше урана-235 внутри (максимум 25), тем сильнее он греется. Чем выше температура, тем больше он тратит воды и вырабатывает пара. Если он разрушен при температуре выше 800°C или остался без воды при температуре выше 800°C на 3 секунды, он взрывается и оставляет зону радиации на 10 минут. Чем больше урана внутри, тем больше зона.
block.nuclear-industry-steam-turbine.name = Паровая турбина
block.nuclear-industry-steam-turbine.description = Превращает пар в большое количество энергии.
bar.nuclear-industry.temp = Температура: {0}°C
bar.nuclear-industry.fuel = Топливо
nuclear-industry.zone-no-build = Нельзя строить в зоне радиации!
block.nuclear-industry-drone-station.name = Станция дронов
block.nuclear-industry-drone-station.description = Вокруг неё кружат дроны без работы, они не теряют здоровье. Дроны с менее чем 50% здоровья прилетают сюда, и станция лечит их голубым лучом.
block.nuclear-industry-drone-depot.name = Хранилище дронов
block.nuclear-industry-drone-depot.description = Хранит по 50 штук каждого ресурса. Дроны-рабочие забирают отсюда ресурсы по 10 штук.
block.nuclear-industry-drone-receiver.name = Приёмник дронов
block.nuclear-industry-drone-receiver.description = Хранит по 50 штук каждого ресурса. Выберите ресурс, и дроны-рабочие будут пополнять его из хранилищ дронов. Чтобы забрать ресурсы, используйте разгрузчик.
block.nuclear-industry-drone-factory.name = Фабрика дронов
block.nuclear-industry-drone-factory.description = Создаёт выбранного дрона из ресурсов, положенных внутрь. Требует энергию. Выберите дрона, чтобы увидеть его стоимость.
unit.nuclear-industry-drone-worker.name = Дрон-рабочий
unit.nuclear-industry-drone-worker.description = Переносит по 10 ресурсов из хранилищ дронов в приёмники. 50 здоровья. Во время работы теряет 5 здоровья за 4 секунды.
unit.nuclear-industry-drone-guard.name = Дрон-защитник
unit.nuclear-industry-drone-guard.description = Сопровождает дронов-рабочих и атакует врагов рядом с ними. 100 здоровья. В работе теряет 5 здоровья за 4 секунды.
unit.nuclear-industry-drone-medic.name = Дрон-медик
unit.nuclear-industry-drone-medic.description = Лечит рабочих и защитников с менее чем 50% здоровья. Сначала помогает дронам с менее чем 6 здоровья. 100 здоровья. В работе теряет 5 здоровья за 4 секунды.
status.nuclear-industry-drone-crippled.name = Обессилен
nuclear-industry.select-drone = Выберите дрона для постройки
nuclear-industry.build-time = Время постройки: {0} с
