name: Release Mod

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build mod jar (desktop + android)
      run: |
        chmod +x ./gradlew
        ./gradlew deploy --no-daemon

    - name: Upload release artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" build/libs/NuclearIndustry.jar --clobber
