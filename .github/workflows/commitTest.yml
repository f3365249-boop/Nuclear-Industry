name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build mod jar (desktop + android)
      run: |
        chmod +x ./gradlew
        ./gradlew deploy --no-daemon

    - name: Upload built jar
      uses: actions/upload-artifact@v4
      with:
        name: NuclearIndustry
        path: build/libs/NuclearIndustry.jar

    # Rolling release with the jar attached, so it can be downloaded straight to a phone.
    - name: Publish latest build as a release
      if: github.event_name == 'push' && github.ref_type == 'branch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest --cleanup-tag --yes || true
        gh release create latest build/libs/NuclearIndustry.jar \
          --target "${{ github.sha }}" \
          --title "Latest build" \
          --notes "Automatic build of ${{ github.sha }}. Works on desktop and Android." \
          --prerelease
